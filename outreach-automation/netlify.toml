[build]
  functions = "netlify/functions"
  command = "npm install"

[functions]
  node_bundler = "esbuild"

# process-queue runs automatically every 20 minutes, forever, on Netlify's
# servers — no browser, no laptop, no cron server of your own needed.
# It sends new leads, sends due follow-ups (every 2 days, max 3), and checks
# for replies (auto-stopping the sequence when someone replies).
[functions."process-queue"]
  schedule = "*/20 * * * *"

[[headers]]
  for = "/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Headers = "Content-Type"
    Access-Control-Allow-Methods = "GET, POST, OPTIONS"
